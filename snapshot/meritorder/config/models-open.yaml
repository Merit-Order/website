# Open-weight and open-API models, included from meritorder.yaml.
#
# Each model lists where it can be served today. Prices for OpenRouter routes come
# from prices.json (`meritorder prices refresh`); a route with no known price is
# never used (a request naming only such routes gets a 503), except on your own GPUs.
#
# hf_id is the Hugging Face repository: what the GPU tier serves when it decides
# self-hosting a model is cheaper than paying per token.
#
# quality (1-5) values are starting points. Tune them with evals on your own work.

backends:
  # Direct vendor APIs (OpenAI-compatible). Switched off until their key is set.
  # Vendor model IDs differ from OpenRouter's; run `meritorder models discover`
  # once a key is set, then add routes such as:
  #   - {backend: deepseek, model: <id from discover>, price: {input: ..., output: ...}}
  deepseek:
    format: openai
    base_url: https://api.deepseek.com/v1
    auth: {type: api_key, value_env: DEEPSEEK_API_KEY}
  mistral:
    format: openai
    base_url: https://api.mistral.ai/v1
    auth: {type: api_key, value_env: MISTRAL_API_KEY}
  moonshot:
    format: openai
    base_url: https://api.moonshot.ai/v1
    auth: {type: api_key, value_env: MOONSHOT_API_KEY}
  zai:
    format: openai
    base_url: https://api.z.ai/api/paas/v4
    auth: {type: api_key, value_env: ZAI_API_KEY}
  minimax:
    format: openai
    base_url: https://api.minimax.io/v1
    auth: {type: api_key, value_env: MINIMAX_API_KEY}

  # OpenRouter's free tier: rate-limited, and providers may log or train on prompts.
  # Off unless MERITORDER_ALLOW_FREE_MODELS=true. Keep it away from sensitive teams
  # with `allowed_backends`.
  openrouter-free:
    enabled: ${MERITORDER_ALLOW_FREE_MODELS:-false}
    format: openai
    base_url: https://openrouter.ai/api/v1
    auth: {type: api_key, value_env: OPENROUTER_API_KEY}

models:
  # ---------------------------------------------------------------- DeepSeek
  # Two releases of V4.1 Flash. 1017 (October 17, 2026) is ahead of September's on every benchmark both ran, but
  # Epoch has no coding results for it yet (so its coding score is its general ability alone) and OpenRouter lists it
  # at DeepSeek's own price, while September's is listed at a cheaper host's. `auto` takes whichever wins; 1017 comes
  # first so that requests naming it aren't caught by the older one's pattern.
  deepseek-v4.1-flash-1017:
    aliases: ["deepseek/deepseek-v4.1-flash-1017*", "deepseek-ai/DeepSeek-V4.1-Flash-1017"]
    hf_id: deepseek-ai/DeepSeek-V4.1-Flash-1017
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: deepseek/deepseek-v4.1-flash-1017}
  deepseek-v4.1-flash:
    aliases: ["deepseek/deepseek-v4.1-flash*", "deepseek-flash", "deepseek"]
    hf_id: deepseek-ai/DeepSeek-V4.1-Flash
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: deepseek/deepseek-v4.1-flash}
  deepseek-v4-pro:
    aliases: ["deepseek/deepseek-v4-pro*", "deepseek-pro"]
    hf_id: deepseek-ai/DeepSeek-V4-Pro
    quality: {coding: 4, general: 4}
    routes:
      - {backend: openrouter, model: deepseek/deepseek-v4-pro}

  # ---------------------------------------------------------------- Z.ai (GLM)
  glm-5.3:
    aliases: ["z-ai/glm-5.3", "zai-org/GLM-5.3", "glm"]
    hf_id: zai-org/GLM-5.3
    quality: {coding: 4, general: 4}
    routes:
      - {backend: openrouter, model: z-ai/glm-5.3}
  glm-5.3-flash:
    aliases: ["z-ai/glm-5.3-flash", "zai-org/GLM-5.3-Flash", "glm-flash"]
    hf_id: zai-org/GLM-5.3-Flash
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: z-ai/glm-5.3-flash}

  # ---------------------------------------------------------------- MiniMax
  minimax-m3.1-flash:
    aliases: ["minimax/minimax-m3.1-flash", "minimax-flash"]
    hf_id: MiniMaxAI/MiniMax-M3.1-Flash
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: minimax/minimax-m3.1-flash}
  minimax-m3:
    aliases: ["minimax/minimax-m3", "minimax"]
    hf_id: MiniMaxAI/Minimax-M3
    quality: {coding: 4, general: 3}
    routes:
      - {backend: openrouter, model: minimax/minimax-m3}

  # ---------------------------------------------------------------- Meta (Muse, Llama)
  muse-spark:
    aliases: ["meta/muse-spark-1.3", "muse-spark-1.3"]
    quality: {coding: 4, general: 4}
    routes:
      - {backend: openrouter, model: meta/muse-spark-1.3}
  muse-spark-open:
    aliases: ["meta/muse-spark-open"]
    hf_id: meta-models/Muse-Spark-Open-816B-A42B
    quality: {coding: 4, general: 4}
    routes:
      - {backend: openrouter, model: meta/muse-spark-open}
  llama-4-maverick:
    aliases: ["meta-llama/llama-4-maverick*"]
    hf_id: meta-llama/Llama-4-Maverick-17B-128E-Instruct
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: meta-llama/llama-4-maverick}

  # ---------------------------------------------------------------- Xiaomi (MiMo)
  mimo-v2.6-flash:
    aliases: ["xiaomi/mimo-v2.6-flash", "mimo-flash"]
    hf_id: XiaomiMiMo/MiMo-V2.6-Flash-RL
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: xiaomi/mimo-v2.6-flash}
  mimo-v2.6-pro:
    aliases: ["xiaomi/mimo-v2.6-pro", "mimo"]
    hf_id: XiaomiMiMo/MiMo-V2.6-Pro-RL
    quality: {coding: 4, general: 4}
    routes:
      - {backend: openrouter, model: xiaomi/mimo-v2.6-pro}

  # ---------------------------------------------------------------- Moonshot (Kimi)
  kimi-k3.1:
    aliases: ["moonshotai/kimi-k3.1*", "kimi-k3.1-pro", "kimi"]
    hf_id: moonshotai/Kimi-K3.1-Pro
    quality: {coding: 5, general: 4}
    routes:
      - {backend: openrouter, model: moonshotai/kimi-k3.1-pro}
  kimi-k3:
    aliases: ["moonshotai/kimi-k3"]
    hf_id: moonshotai/Kimi-K3
    quality: {coding: 4, general: 4}
    routes:
      - {backend: openrouter, model: moonshotai/kimi-k3}

  # ---------------------------------------------------------------- Qwen
  qwen3-coder:
    aliases: ["qwen/qwen3-coder", "Qwen/Qwen3-Coder-480B*"]
    hf_id: Qwen/Qwen3-Coder-480B-A35B-Instruct
    quality: {coding: 4, general: 2}
    routes:
      - {backend: openrouter, model: qwen/qwen3-coder}
  qwen3-coder-next:
    aliases: ["qwen/qwen3-coder-next", "Qwen/Qwen3-Coder-Next"]
    hf_id: Qwen/Qwen3-Coder-Next
    quality: {coding: 4, general: 2}
    routes:
      # Self-hosted routes are priced at the API-equivalent rate; the router applies the
      # shadow price (near zero while there's headroom) and reports chargeback cost.
      - {backend: local-vllm, model: Qwen/Qwen3-Coder-Next, price: {input: 0.12, output: 0.80, cache_read: 0.07}}
      - {backend: gpu-qwen-coder, model: Qwen/Qwen3-Coder-Next, price: {input: 0.12, output: 0.80, cache_read: 0.07}}
      - {backend: gpu-qwen-coder-k8s, model: Qwen/Qwen3-Coder-Next, price: {input: 0.12, output: 0.80, cache_read: 0.07}}
      - {backend: openrouter, model: qwen/qwen3-coder-next}
  qwen3-coder-30b:
    aliases: ["qwen/qwen3-coder-30b*", "Qwen/Qwen3-Coder-30B*"]
    hf_id: Qwen/Qwen3-Coder-30B-A3B-Instruct
    quality: {coding: 3, general: 2}
    routes:
      - {backend: openrouter, model: qwen/qwen3-coder-30b-a3b-instruct}
  qwen3.8-flash:
    aliases: ["qwen/qwen3.8-flash"]
    hf_id: Qwen/Qwen3.8-Flash-Next
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: qwen/qwen3.8-flash}

  # ---------------------------------------------------------------- Mistral
  # Mistral's own API (MISTRAL_API_KEY, hosted in the EU) and OpenRouter, at the same prices. Devstral isn't on
  # Mistral's API. Mistral Medium 3.5, its closed model, is left out: it scores below Large 4 and costs twice as much.
  mistral-large-4:
    aliases: ["mistralai/mistral-large-4*", "mistral-large"]
    hf_id: mistralai/Mistral-Large-4-1T-A52B
    quality: {coding: 4, general: 4}
    routes:
      - {backend: mistral, model: mistral-large-4-0}
      - {backend: openrouter, model: mistralai/mistral-large-4-0}
  devstral-2:
    aliases: ["mistralai/devstral*", "devstral"]
    hf_id: mistralai/Devstral-2-123B-Instruct-2512
    quality: {coding: 4, general: 2}
    routes:
      - {backend: openrouter, model: mistralai/devstral-2512}
  mistral-small-4:
    aliases: ["mistralai/mistral-small-2603", "mistral-small"]
    hf_id: mistralai/Mistral-Small-4-119B-2603
    quality: {coding: 3, general: 3}
    routes:
      - {backend: mistral, model: mistral-small-2603}
      - {backend: openrouter, model: mistralai/mistral-small-2603}
  ministral-14b:
    aliases: ["mistralai/ministral-14b*"]
    hf_id: mistralai/Ministral-3-14B-Instruct-2512
    quality: {coding: 2, general: 2}
    routes:
      - {backend: mistral, model: ministral-14b-2512}
      - {backend: openrouter, model: mistralai/ministral-14b-2512}

  # ---------------------------------------------------------------- Google (Gemma)
  gemma-4-31b:
    aliases: ["google/gemma-4-31b*"]
    hf_id: google/gemma-4-31B-it
    quality: {coding: 2, general: 3}
    routes:
      - {backend: openrouter, model: google/gemma-4-31b-it}
      - {backend: openrouter-free, model: "google/gemma-4-31b-it:free", price: {input: 0, output: 0}}

  # ---------------------------------------------------------------- NVIDIA (Nemotron)
  nemotron-3-ultra:
    aliases: ["nvidia/nemotron-3-ultra*"]
    benchmark_name: Nemotron 3 Ultra
    hf_id: nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B-BF16
    quality: {coding: 4, general: 4}
    routes:
      - {backend: openrouter, model: nvidia/nemotron-3-ultra-550b-a55b}
      - {backend: openrouter-free, model: "nvidia/nemotron-3-ultra-550b-a55b:free", price: {input: 0, output: 0}}
  nemotron-3.5-super:
    aliases: ["nvidia/nemotron-3.5-super*"]
    hf_id: nvidia/NVIDIA-Nemotron-3.5-Super-VL
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: nvidia/nemotron-3.5-super-vl}
      - {backend: openrouter-free, model: "nvidia/nemotron-3.5-super-vl:free", price: {input: 0, output: 0}}

  # ---------------------------------------------------------------- OpenAI open-weight
  gpt-oss-120b:
    aliases: ["openai/gpt-oss-120b"]
    hf_id: openai/gpt-oss-120b
    quality: {coding: 3, general: 3}
    routes:
      - {backend: openrouter, model: openai/gpt-oss-120b}
  gpt-oss-20b:
    aliases: ["openai/gpt-oss-20b"]
    hf_id: openai/gpt-oss-20b
    quality: {coding: 2, general: 2}
    routes:
      - {backend: gpu-small, model: openai/gpt-oss-20b, price: {input: 0.03, output: 0.13, cache_read: 0.03}}  # off unless MERITORDER_SKYPILOT_SMALL
      - {backend: openrouter, model: openai/gpt-oss-20b}
