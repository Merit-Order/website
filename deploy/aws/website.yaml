AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  The Merit Order website (https://meritorder.dev) as a static site: a private S3 bucket behind CloudFront, a certificate
  and DNS for the apex and www, and a role GitHub Actions deploys with. Deploy in us-east-1 (CloudFront takes
  certificates from there only). See deploy/aws/README.md.

Parameters:
  DomainName:
    Type: String
    Default: meritorder.dev
    Description: The apex the site is served at. www.<DomainName> redirects to it. Both must be in the hosted zone below.
  HostedZoneId:
    Type: AWS::Route53::HostedZone::Id
    Description: >-
      The Route 53 hosted zone for the name (aws route53 list-hosted-zones-by-name --dns-name meritorder.dev). The
      certificate is validated and the alias records are written there.
  GitHubSubjects:
    Type: CommaDelimitedList
    Default: "repo:Merit-Order@355502678/website@1458952464:ref:refs/heads/main,repo:Merit-Order/website:ref:refs/heads/main"
    Description: >-
      The GitHub OIDC subjects the deploy role trusts: workflows on main of Merit-Order/website only. The repository
      uses GitHub's immutable subjects (gh api repos/Merit-Order/website/actions/oidc/customization/sub), so it sends
      repo:<owner>@<owner id>/<repo>@<repo id>:ref:refs/heads/main; the plain form is listed in case that setting is
      turned off. A job that names an environment gets a different subject (repo:...:environment:<name>) and isn't
      trusted.
  GitHubOidcProviderArn:
    Type: String
    Default: ""
    Description: >-
      The account's existing OIDC provider for token.actions.githubusercontent.com (the meritorder-demo-site stack
      created it). Empty means arn:aws:iam::<this account>:oidc-provider/token.actions.githubusercontent.com. This
      stack never creates one: an account has at most one per URL.

Conditions:
  DefaultOidcArn: !Equals [!Ref GitHubOidcProviderArn, ""]

Resources:
  # ------------------------------------------------------------------ the files

  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete  # holds only the build, which the pipeline writes again; empty it before deleting the stack
    Properties:
      BucketName: !Sub "meritorder-website-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules: [{ObjectOwnership: BucketOwnerEnforced}]
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: {SSEAlgorithm: AES256}
      LifecycleConfiguration:
        Rules:
          - Id: expire-noncurrent
            Status: Enabled
            NoncurrentVersionExpiration: {NoncurrentDays: 7}
            ExpiredObjectDeleteMarker: true
          - Id: abort-incomplete-uploads
            Status: Enabled
            AbortIncompleteMultipartUpload: {DaysAfterInitiation: 1}

  SiteBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: CloudFrontReadsThroughOAC
            Effect: Allow
            Principal: {Service: cloudfront.amazonaws.com}
            Action: s3:GetObject
            Resource: !Sub "${SiteBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"
          - Sid: TLSOnly
            Effect: Deny
            Principal: "*"
            Action: "s3:*"
            Resource: [!GetAtt SiteBucket.Arn, !Sub "${SiteBucket.Arn}/*"]
            Condition:
              Bool: {aws:SecureTransport: "false"}

  # ------------------------------------------------------------------ the names

  Certificate:
    Type: AWS::CertificateManager::Certificate
    Properties:
      DomainName: !Ref DomainName
      SubjectAlternativeNames: [!Sub "www.${DomainName}"]
      ValidationMethod: DNS
      DomainValidationOptions:  # CloudFormation writes the validation records into the zone and waits for the certificate
        - {DomainName: !Ref DomainName, HostedZoneId: !Ref HostedZoneId}
        - {DomainName: !Sub "www.${DomainName}", HostedZoneId: !Ref HostedZoneId}

  ApexA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false}

  ApexAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: AAAA
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false}

  WwwA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: A
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false}

  WwwAAAA:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub "www.${DomainName}"
      Type: AAAA
      AliasTarget: {DNSName: !GetAtt Distribution.DomainName, HostedZoneId: Z2FDTNDATAQYW2, EvaluateTargetHealth: false}

  # ------------------------------------------------------------------ CloudFront

  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-oac"
        Description: CloudFront reads the website bucket, which stays private
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  # www to the apex, and Astro's clean URLs: /savings -> 301 /savings/, and /savings/ -> /savings/index.html at the origin.
  # Paths whose last segment has a dot are files and pass through.
  UrlFunction:
    Type: AWS::CloudFront::Function
    Properties:
      Name: !Sub "${AWS::StackName}-urls"
      AutoPublish: true
      FunctionConfig:
        Comment: www to apex, directory index, trailing slash
        Runtime: cloudfront-js-2.0
      FunctionCode: !Sub |
        function qs(q) {
          var parts = [];
          for (var k in q) {
            var v = q[k];
            if (v.multiValue) { v.multiValue.forEach(function (m) { parts.push(k + '=' + m.value); }); }
            else { parts.push(v.value === '' ? k : k + '=' + v.value); }
          }
          return parts.length ? '?' + parts.join('&') : '';
        }
        function redirect(location) {
          return { statusCode: 301, statusDescription: 'Moved Permanently',
                   headers: { location: { value: location }, 'cache-control': { value: 'public, max-age=3600' } } };
        }
        function handler(event) {
          var req = event.request;
          var host = req.headers.host ? req.headers.host.value.toLowerCase() : '';
          if (host !== '${DomainName}') {
            return redirect('https://${DomainName}' + req.uri + qs(req.querystring));
          }
          var uri = req.uri;
          if (uri.endsWith('/')) {
            req.uri = uri + 'index.html';
          } else {
            var last = uri.substring(uri.lastIndexOf('/') + 1);
            if (last.indexOf('.') === -1) {
              return redirect(uri + '/' + qs(req.querystring));
            }
          }
          return req;
        }

  # Checked against the build: scripts and styles are files on this origin, plus small inline scripts (theme, Starlight's
  # UI) and inline styles (Starlight, the diagrams' SVG). Each page also carries a meta Content-Security-Policy with the
  # sha256 of every inline script on it (scripts/csp.mjs), which narrows script-src below to exactly those; this header
  # sets the rest, which a meta tag can't (frame-ancestors). Pagefind search loads WebAssembly ('wasm-unsafe-eval') and
  # fetches its index from /pagefind/. Fonts are self-hosted. No third-party origins.
  SecurityHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub "${AWS::StackName}-security"
        Comment: Merit Order website security headers
        SecurityHeadersConfig:
          StrictTransportSecurity: {AccessControlMaxAgeSec: 63072000, IncludeSubdomains: true, Preload: false, Override: true}
          ContentTypeOptions: {Override: true}
          FrameOptions: {FrameOption: DENY, Override: true}
          ReferrerPolicy: {ReferrerPolicy: strict-origin-when-cross-origin, Override: true}
          ContentSecurityPolicy:
            Override: true
            ContentSecurityPolicy: >-
              default-src 'none'; script-src 'self' 'unsafe-inline' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline';
              img-src 'self' data:; font-src 'self'; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self';
              base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; upgrade-insecure-requests
        CustomHeadersConfig:
          Items:
            - {Header: Permissions-Policy, Value: "camera=(), microphone=(), geolocation=(), payment=(), usb=()", Override: true}
            - {Header: Cross-Origin-Opener-Policy, Value: same-origin, Override: true}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Merit Order website (${DomainName})"
        Enabled: true
        Aliases: [!Ref DomainName, !Sub "www.${DomainName}"]
        HttpVersion: http2and3
        IPV6Enabled: true
        PriceClass: PriceClass_100  # North America and Europe edges: the cheapest class
        DefaultRootObject: index.html
        ViewerCertificate:
          AcmCertificateArn: !Ref Certificate
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: site
            DomainName: !GetAtt SiteBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt OriginAccessControl.Id
            S3OriginConfig: {OriginAccessIdentity: ""}
        # How long things are kept is set on the objects (the pipeline writes Cache-Control) and CachingOptimized follows
        # it (and compresses, gzip and Brotli). /_astro/*: Astro puts a content hash in every name, so a changed file is a
        # new URL: "public, max-age=31536000, immutable". Everything else (HTML, /pagefind/, /data/, the sitemap):
        # "no-cache", so browsers and the edge check for a new version on every load (a cheap 304) and a deploy shows at
        # once.
        DefaultCacheBehavior:
          TargetOriginId: site
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # Managed-CachingOptimized
          ResponseHeadersPolicyId: !Ref SecurityHeaders
          FunctionAssociations:
            - {EventType: viewer-request, FunctionARN: !GetAtt UrlFunction.FunctionMetadata.FunctionARN}
        # S3 answers 403 for a missing key (CloudFront may not list the bucket), so both mean "not found": Astro's 404 page,
        # with a 404 status.
        CustomErrorResponses:
          - {ErrorCode: 403, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60}
          - {ErrorCode: 404, ResponseCode: 404, ResponsePagePath: /404.html, ErrorCachingMinTTL: 60}

  # ------------------------------------------------------------------ deploys from GitHub Actions

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${AWS::StackName}-deploy"
      Description: GitHub Actions on main of Merit-Order/website uploads the site and invalidates CloudFront
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - DefaultOidcArn
                - !Sub "arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
                - !Ref GitHubOidcProviderArn
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Ref GitHubSubjects
      Policies:
        - PolicyName: deploy-website
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: List
                Effect: Allow
                Action: s3:ListBucket
                Resource: !GetAtt SiteBucket.Arn
              - Sid: WriteFiles
                Effect: Allow
                Action: [s3:PutObject, s3:DeleteObject]
                Resource: !Sub "${SiteBucket.Arn}/*"
              - Sid: Invalidate
                Effect: Allow
                Action: cloudfront:CreateInvalidation
                Resource: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${Distribution}"

Outputs:
  BucketName:
    Description: The bucket the build goes to (repository variable SITE_BUCKET)
    Value: !Ref SiteBucket
  DistributionId:
    Description: The CloudFront distribution (repository variable SITE_DISTRIBUTION_ID)
    Value: !Ref Distribution
  DistributionDomainName:
    Description: CloudFront's own name for the distribution
    Value: !GetAtt Distribution.DomainName
  DeployRoleArn:
    Description: The role GitHub Actions assumes (repository variable SITE_DEPLOY_ROLE_ARN)
    Value: !GetAtt DeployRole.Arn
  Url:
    Description: Where the site is served
    Value: !Sub "https://${DomainName}/"
